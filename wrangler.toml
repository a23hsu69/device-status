name = "device-status-worker"
main = "worker.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["0 */2 * * *"]

[[kv_namespaces]]
binding = "PUSH_SUBS"
id = "eeca7118619c406c9cfa1c70b5bc4706"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
